name: CI

on:
  push:
    branches: [main]
  pull_request:

# Coolify deploys are manual, so nothing here gates a release. This exists to
# catch a broken push before someone presses Deploy hours later.
jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile. Prisma 7 needs 22.12 or newer.
          node-version: "22"
          cache: npm

      - run: npm ci

      # Prisma 7 does not generate the client on install, and the generated
      # types are what @prisma/client re-exports. Without this the type check
      # reports every model as `any` and every enum as a missing export.
      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Unit tests
        run: npm test

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          # The build never reaches a database: isDatabaseConfigured() returns
          # false during next build, and prisma.config.ts falls back to this URL
          # for prisma generate.
          DATABASE_URL: postgresql://fairprice:ci@localhost:5432/fairprice
